[package]
name = "ntfy-win"
version = "2.0.0"
edition = "2021"
description = "Minimal ntfy push client that lives in the Windows tray"
license = "MIT"
build = "build.rs"

[dependencies]
native-windows-gui = "1.0.13"
tray-icon = "0.19"
tauri-winrt-notification = "0.2"
# 阻塞版 websocket + schannel：证书从系统证书库按指纹取，不再解析 pfx
tungstenite = "0.24"
schannel = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
